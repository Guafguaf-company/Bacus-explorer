
name: Bacus Explorer - Static Analysis

on:
  push:
    branches: [main, pruebas]
  pull_request:
    branches: [main, pruebas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang-tidy \
            pkg-config \
            libgtk-3-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run clang-tidy
        shell: bash
        run: |
          mapfile -t files < <(
            find app tests -type f -name '*.cpp' 2>/dev/null | sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 0
          fi

          clang-tidy -p build "${files[@]}"
