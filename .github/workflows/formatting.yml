
name: Bacus Explorer - Formatting

on:
  push:
    branches: [main, pruebas]
  pull_request:
    branches: [main, pruebas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t files < <(
            find app bacus-core bacus-security bacus-vault tests \
              -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
              2>/dev/null | sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 0
          fi

          clang-format --dry-run --Werror "${files[@]}"
