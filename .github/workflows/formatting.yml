
name: Bacus Explorer - Formatting

on:
  push:
    branches: [main, pruebas]
  pull_request:
    branches: [main, pruebas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    name: C++ Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check C++ formatting
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' -t files < <(
            git ls-files -z -- '*.cpp' '*.hpp' '*.h'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 0
          fi

          clang-format-18 --dry-run --Werror "${files[@]}"

          echo "All C++ files follow the formatting rules."
